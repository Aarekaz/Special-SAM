# Ablation study: Box-only prompt training
# Tests whether mixed prompt training improves robustness

seed: 42

model:
  type: vit_h
  checkpoint: weights/sam_vit_h_4b8939.pth

data:
  dataset: cod10k
  train_img_dir: data/cod10k/COD10K-v3/Train/Image
  train_mask_dir: data/cod10k/COD10K-v3/Train/GT_Object

preprocessing:
  target_size: 1024
  augmentation:
    horizontal_flip: true

embeddings:
  dir: data/embeddings/camo_embeddings_vith
  metadata_csv: data/embeddings/camo_train_meta_vith.csv

training:
  epochs: 15
  learning_rate: 1.0e-4
  optimizer: AdamW
  batch_size: 1
  weight_decay: 0.01
  lr_scheduler: cosine
  warmup_epochs: 1
  prompt_mix: box_only
  loss:
    bce_weight: 0.5
    dice_weight: 0.5

output:
  decoder_path: checkpoints/ablation/camo_decoder_box_only.pth
